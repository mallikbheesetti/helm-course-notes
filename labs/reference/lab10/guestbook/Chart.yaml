apiVersion: v2
name: guestbook
appVersion: "2.0"
description: Guestbook umbrella chart with local dependency resolution
version: 1.2.2
type: application
dependencies:
  - name: frontend
    version: 1.2.2
    repository: file://charts/frontend
  - name: backend
    version: 1.2.2
    repository: file://charts/backend
    condition: backend.enabled
    tags:
      - api
  - name: database
    version: 1.2.2
    repository: file://charts/database
    condition: database.enabled
    tags:
      - api
